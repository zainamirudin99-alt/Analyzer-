name: Supabase Keepalive

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - name: Ping Supabase RPC keepalive_ping
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Ping deployed app keepalive endpoint
        if: ${{ env.APP_URL != '' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 --retry 3 --retry-delay 15 \
            "$APP_URL/api/cron/keepalive"
